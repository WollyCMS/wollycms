name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npx --workspace=packages/admin svelte-kit sync
      - run: npm test
      - name: Build admin UI
        run: npm run build --workspace=packages/admin
      - name: Check admin CSP (issue #65 regression guard)
        run: node scripts/check-admin-csp.mjs

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$NPM_CONFIG_USERCONFIG"

      - name: Build server
        run: npm run build --workspace=packages/server

      - name: Build admin UI
        run: npx --workspace=packages/admin svelte-kit sync && npm run build --workspace=packages/admin

      - name: Bundle admin UI into server package
        run: cp -r packages/admin/build packages/server/admin-ui

      - name: Validate package entry points
        run: node scripts/check-package-exports.mjs

      - name: Publish @wollycms/server
        run: node scripts/publish-if-needed.mjs packages/server

      - name: Publish @wollycms/astro
        run: node scripts/publish-if-needed.mjs packages/astro

      - name: Publish create-wolly
        run: node scripts/publish-if-needed.mjs packages/create-wolly
